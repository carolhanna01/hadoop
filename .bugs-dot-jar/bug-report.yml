      description: '<p>The likelihood that someone would want to enter a non-positive
        value for -bandwidth seems really low. However, the job would never complete
        if a non-positive value was specified. It''d just get stuck at map 100%. Luckily,
        a positive value would always lead to the job completing.</p>


