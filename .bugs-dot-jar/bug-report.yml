      comments:
        comment:
        - '#text': "<p>The PBHelper code has:</p>\n<div class=\"code panel\" style=\"\
            border-width: 1px;\"><div class=\"codeContent panelContent\">\n<pre class=\"\
            code-java\">    <span class=\"code-keyword\">for</span> (<span class=\"\
            code-object\">int</span> i = 0; i &lt; list.size(); i++) {\n      recoveringBlocks.add(PBHelper.convert(list.get(0)));\n\
            \    }\n</pre>\n</div></div>\n<p>which is obviously wrong</p>"
          '@author': tlipcon
          '@created': Fri, 17 Feb 2012 20:10:50 +0000
          '@id': '13210500'
        - '#text': <p>Good catch, Todd. Do you not think this should also go in 0.23.1?</p>
          '@author': atm
          '@created': Fri, 17 Feb 2012 20:12:08 +0000
          '@id': '13210504'
        - '#text': <p>0.23.1 doesn't have protobufs in place yet, right?</p>
          '@author': tlipcon
          '@created': Fri, 17 Feb 2012 20:31:28 +0000
          '@id': '13210522'
        - '#text': <p>Attached patch fixes the issue and adds a unit test</p>
          '@author': tlipcon
          '@created': Fri, 17 Feb 2012 20:32:47 +0000
          '@id': '13210523'
        - '#text': '<blockquote><p>0.23.1 doesn''t have protobufs in place yet, right?</p></blockquote>


            <p>Whoops! Of course you''re right. <img class="emoticon" src="https://issues.apache.org/jira/images/icons/emoticons/smile.png"
            height="16" width="16" align="absmiddle" alt="" border="0"/></p>'
          '@author': atm
          '@created': Fri, 17 Feb 2012 20:33:35 +0000
          '@id': '13210524'
        - '#text': <p>+1, the patch looks good to me. Good find, Todd.</p>
