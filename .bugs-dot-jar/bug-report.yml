      comments:
        comment:
        - '#text': "<p>Following code is obviously wrong:</p>\n<div class=\"code panel\"\
            \ style=\"border-width: 1px;\"><div class=\"codeContent panelContent\"\
            >\n<pre class=\"code-java\">    ExtendedBlock b = (ExtendedBlock)o;\n\
            \    <span class=\"code-keyword\">return</span> b.block.equals(block)\
            \ || b.poolId.equals(poolId);\n</pre>\n</div></div>"
          '@author': tlipcon
          '@created': Fri, 17 Feb 2012 20:20:37 +0000
          '@id': '13210509'
        - '#text': <p>Attached patch has a unit test and fix</p>
