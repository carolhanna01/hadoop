      description: "<p>Output from WebHdfs:<br/>\ncurl -X PUT  \"http://weichiu.vpc.cloudera.com:50070/webhdfs/v1/a?aclspec=group:user:&amp;op=REMOVEACLENTRIES&amp;user.name=weichiu\"\
        </p>\n\n\n<p>Output from HttpFs:<br/>\ncurl -X PUT  \"http://weichiu.vpc.cloudera.com:14000/webhdfs/v1/a?aclspec=group:user:&amp;op=REMOVEACLENTRIES&amp;user.name=weichiu\"\
        </p>\n\n<p>{\"RemoteException\":{\"message\":\"Invalid &lt;aclSpec&gt; : group:user:\"\
        ,\"exception\":\"HadoopIllegalArgumentException\",\"javaClassName\":\"org.apache.hadoop.HadoopIllegalArgumentException\"\
        }}</p>\n\n<p>The exception is thrown because the ACL string \"group:user:\"\
        \ is not recognized by HttpFs.<br/>\nEffectively, what this means is that\
        \ the behavior of HttpFs is not consistent with that of WebHdfs.</p>\n\n\n\
        <p>Additionally, command line does accept the ACL string. For example:<br/>\n\
        hdfs dfds -setfactl -x group:yyy: /a</p>\n\n\n<p>Bug is reproducible if httpfs\
        \ and acl are enabled, and reproducible on single-node cluster configuration.</p>\n\
        \n<p>To reproduce, add into core-site.xml:<br/>\n&lt;property&gt;<br/>\n&lt;name&gt;dfs.webhdfs.enabled&lt;/name&gt;<br/>\n\
        &lt;value&gt;true&lt;/value&gt;<br/>\n&lt;/property&gt;<br/>\n&lt;property&gt;<br/>\n\
        &lt;name&gt;dfs.namenode.acls.enabled&lt;/name&gt;<br/>\n&lt;value&gt;true&lt;/value&gt;<br/>\n\
        &lt;/property&gt;<br/>\n&lt;property&gt;<br/>\n    &lt;name&gt;hadoop.proxyuser.#HTTPFSUSER#.hosts&lt;/name&gt;<br/>\n\
        \    &lt;value&gt;httpfs-host.foo.com&lt;/value&gt;<br/>\n  &lt;/property&gt;<br/>\n\
        \  &lt;property&gt;<br/>\n    &lt;name&gt;hadoop.proxyuser.#HTTPFSUSER#.groups&lt;/name&gt;<br/>\n\
        \    &lt;value&gt;*&lt;/value&gt;<br/>\n  &lt;/property&gt;</p>\n\n<p>restart\
        \ name node, data node and httpfs daemon</p>\n\n<p>Credit to <a href=\"https://issues.apache.org/jira/secure/ViewProfile.jspa?name=romainr\"\
        \ class=\"user-hover\" rel=\"romainr\">romainr</a> for reporting the issue.</p>"
