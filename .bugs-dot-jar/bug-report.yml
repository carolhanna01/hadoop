      comments:
        comment:
        - '#text': "<p>I've filed this as critical for now, but if folks think this\
            \ should be a blocker I'm fine raising the priority.</p>\n\n<p>Though\
            \ the issue is fairly critical, the bug is fairly straightforward. In\
            \ <tt>FSImageFormatPBINode#save(OutputStream, INodeFile)</tt> we have\
            \ the following code:</p>\n\n<div class=\"code panel\" style=\"border-width:\
            \ 1px;\"><div class=\"codeContent panelContent\">\n<pre class=\"code-java\"\
            >        <span class=\"code-keyword\">for</span> (Block block : n.getBlocks())\
            \ {\n          b.addBlocks(PBHelper.convert(block));\n        }\n</pre>\n\
            </div></div>\n\n<p>Perhaps not obviously, this assumes that <tt>n.getBlocks()</tt>\
            \ will never return <tt>null</tt>. However, this is possible in the above-described\
            \ scenario because of this code in <tt>FileWithSnapshotFeature#collectBlocksBeyondMax</tt>:</p>\n\
            \n<div class=\"code panel\" style=\"border-width: 1px;\"><div class=\"\
            codeContent panelContent\">\n<pre class=\"code-java\">        <span class=\"\
            code-keyword\">final</span> BlockInfo[] newBlocks;\n        <span class=\"\
            code-keyword\">if</span> (n == 0) {\n          newBlocks = <span class=\"\
            code-keyword\">null</span>;\n        } <span class=\"code-keyword\">else</span>\
            \ {\n          newBlocks = <span class=\"code-keyword\">new</span> BlockInfo[n];\n\
            \          <span class=\"code-object\">System</span>.arraycopy(oldBlocks,\
            \ 0, newBlocks, 0, n);\n        }\n        \n        <span class=\"code-comment\"\
            >// set <span class=\"code-keyword\">new</span> blocks\n</span>      \
            \  file.setBlocks(newBlocks);\n</pre>\n</div></div>\n\n<p>When attempting\
            \ to save an fsimage after this code has been run, errors like the following\
            \ will appear in the logs:</p>\n\n<div class=\"preformatted panel\" style=\"\
            border-width: 1px;\"><div class=\"preformattedContent panelContent\">\n\
            <pre>2014-06-18 16:55:11,295 ERROR namenode.FSImage (FSImage.java:run(988))\
            \ - Unable to save image for /home/atm/src/apache/hadoop.git/src/hadoop-hdfs-project/hadoop-hdfs/build/test/data/dfs/name1\n\
            java.lang.NullPointerException\n\tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatPBINode$Saver.save(FSImageFormatPBINode.java:537)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatPBINode$Saver.save(FSImageFormatPBINode.java:518)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatPBINode$Saver.serializeINodeSection(FSImageFormatPBINode.java:491)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatProtobuf$Saver.saveInodes(FSImageFormatProtobuf.java:412)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatProtobuf$Saver.saveInternal(FSImageFormatProtobuf.java:457)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatProtobuf$Saver.save(FSImageFormatProtobuf.java:393)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImage.saveFSImage(FSImage.java:931)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImage$FSImageSaver.run(FSImage.java:982)\n\
            \tat java.lang.Thread.run(Thread.java:724)\n2014-06-18 16:55:11,295 ERROR\
            \ namenode.FSImage (FSImage.java:run(988)) - Unable to save image for\
            \ /home/atm/src/apache/hadoop.git/src/hadoop-hdfs-project/hadoop-hdfs/build/test/data/dfs/name2\n\
            java.lang.NullPointerException\n\tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatPBINode$Saver.save(FSImageFormatPBINode.java:537)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatPBINode$Saver.save(FSImageFormatPBINode.java:518)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatPBINode$Saver.serializeINodeSection(FSImageFormatPBINode.java:491)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatProtobuf$Saver.saveInodes(FSImageFormatProtobuf.java:412)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatProtobuf$Saver.saveInternal(FSImageFormatProtobuf.java:457)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImageFormatProtobuf$Saver.save(FSImageFormatProtobuf.java:393)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImage.saveFSImage(FSImage.java:931)\n\
            \tat org.apache.hadoop.hdfs.server.namenode.FSImage$FSImageSaver.run(FSImage.java:982)\n\
            \tat java.lang.Thread.run(Thread.java:724)\n2014-06-18 16:55:11,297 ERROR\
            \ common.Storage (NNStorage.java:reportErrorsOnDirectory(808)) - Error\
            \ reported on storage directory Storage Directory /home/atm/src/apache/hadoop.git/src/hadoop-hdfs-project/hadoop-hdfs/build/test/data/dfs/name1\n\
            2014-06-18 16:55:11,297 WARN  common.Storage (NNStorage.java:reportErrorsOnDirectory(813))\
            \ - About to remove corresponding storage: /home/atm/src/apache/hadoop.git/src/hadoop-hdfs-project/hadoop-hdfs/build/test/data/dfs/name1\n\
            2014-06-18 16:55:11,297 ERROR common.Storage (NNStorage.java:reportErrorsOnDirectory(808))\
            \ - Error reported on storage directory Storage Directory /home/atm/src/apache/hadoop.git/src/hadoop-hdfs-project/hadoop-hdfs/build/test/data/dfs/name2\n\
            2014-06-18 16:55:11,297 WARN  common.Storage (NNStorage.java:reportErrorsOnDirectory(813))\
            \ - About to remove corresponding storage: /home/atm/src/apache/hadoop.git/src/hadoop-hdfs-project/hadoop-hdfs/build/test/data/dfs/name2\n\
            </pre>\n</div></div>"
