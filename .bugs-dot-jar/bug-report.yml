      description: "<p>We submited a distributed shell application\_after\_RM failover\
        \ and back to active, then got NPE error in RM log:</p>\n<div class=\"preformatted\
        \ panel\" style=\"border-width: 1px;\"><div class=\"preformattedContent panelContent\"\
        >\n<pre>java.lang.NullPointerException\n        at org.apache.hadoop.yarn.server.resourcemanager.ClientRMService.getResourceProfiles(ClientRMService.java:1814)\n\
        \        at org.apache.hadoop.yarn.api.impl.pb.service.ApplicationClientProtocolPBServiceImpl.getResourceProfiles(ApplicationClientProtocolPBServiceImpl.java:657)\n\
        \        at org.apache.hadoop.yarn.proto.ApplicationClientProtocol$ApplicationClientProtocolService$2.callBlockingMethod(ApplicationClientProtocol.java:617)\n\
        \        at org.apache.hadoop.ipc.ProtobufRpcEngine$Server$ProtoBufRpcInvoker.call(ProtobufRpcEngine.java:523)\n\
        \        at org.apache.hadoop.ipc.RPC$Server.call(RPC.java:991)\n        at\
        \ org.apache.hadoop.ipc.Server$RpcCall.run(Server.java:869)\n        at org.apache.hadoop.ipc.Server$RpcCall.run(Server.java:815)\n\
        \        at java.security.AccessController.doPrivileged(Native Method)\n \
        \       at javax.security.auth.Subject.doAs(Subject.java:422)\n        at\
        \ org.apache.hadoop.security.UserGroupInformation.doAs(UserGroupInformation.java:1682)\n\
        \        at org.apache.hadoop.ipc.Server$Handler.run(Server.java:2675)\n</pre>\n\
        </div></div>\n\n<p>The cause is that currently resourceProfilesManager is\
        \ not transferred to new RMContext instance in RMContext#resetRMContext. We\
        \ should do this transfer to fix this error.</p>\n<div class=\"code panel\"\
        \ style=\"border-width: 1px;\"><div class=\"codeContent panelContent\">\n\
        <pre class=\"code-java\">\n@@ -1488,6 +1488,10 @@ <span class=\"code-keyword\"\
        >private</span> void resetRMContext() {\n     <span class=\"code-comment\"\
        >// transfer service context to <span class=\"code-keyword\">new</span> RM\
        \ service Context\n</span>     rmContextImpl.setServiceContext(rmContext.getServiceContext());\n\
        \n+    <span class=\"code-comment\">// transfer resource profiles manager\n\
        </span>+    rmContextImpl\n+        .setResourceProfilesManager(rmContext.getResourceProfilesManager());\n\
        +\n     <span class=\"code-comment\">// reset dispatcher\n</span>     Dispatcher\
        \ dispatcher = setupDispatcher();\n     ((Service) dispatcher).init(<span\
        \ class=\"code-keyword\">this</span>.conf);\n</pre>\n</div></div>"
