      description: '<p>A valid host name can start with numeric value (You can refer
        RFC952, RFC1123 or <a href="http://www.zytrax.com/books/dns/apa/names.html"
        class="external-link" target="_blank" rel="nofollow noopener">http://www.zytrax.com/books/dns/apa/names.html</a>),
        so it is possible in a production environment, user name their hadoop nodes
        as: 1hosta, 2hostb, etc. But normalizeHostName() will recognise this hostname
        as IP address and return directly rather than resolving the real IP address.
        These nodes will be failed to get correct network topology if topology script/TableMapping
        only contains their IPs (without hostname).</p>'
