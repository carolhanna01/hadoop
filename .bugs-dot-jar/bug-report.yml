          '@size': '8114'
      comments:
        comment:
        - '#text': "<p>Thanks <a href=\"https://issues.apache.org/jira/secure/ViewProfile.jspa?name=Tao+Yang\"\
            \ class=\"user-hover\" rel=\"Tao Yang\">Tao Yang</a>, nice catch. ResourceProfilesManager\
            \ was added in\_<a href=\"https://issues.apache.org/jira/browse/YARN-5707\"\
            \ title=\"Add manager class for resource profiles\" class=\"issue-link\"\
            \ data-issue-key=\"YARN-5707\"><del>YARN-5707</del></a>, so only affected\
            \ version is 3.1.0. Since this one would cause NPE in fail-over, not sure\
            \ if we can get this into 3.1.0 as it already enters RC0. + <a href=\"\
            https://issues.apache.org/jira/secure/ViewProfile.jspa?name=wangda\" class=\"\
            user-hover\" rel=\"wangda\">wangda</a> to the loop.</p>\n\n<p>Regarding\
            \ to the fix, can we move <tt>ResourceProfilesManager</tt> into the\_\
            <tt>RMServiceContext</tt> ? As ResourceManager#resetRMContext is supposedly\
            \ to get the reset done by</p>\n<div class=\"code panel\" style=\"border-width:\
            \ 1px;\"><div class=\"codeContent panelContent\">\n<pre class=\"code-java\"\
            >\nrmContextImpl.setServiceContext(rmContext.getServiceContext());\n\n\
            </pre>\n</div></div>\n<p>\_don't think we need an extra set here.\_Does\
            \ that make sense?</p>\n\n<p>Thanks</p>"
          '@author': cheersyang
          '@created': Thu, 29 Mar 2018 05:18:26 +0000
          '@id': '16418450'
        - '#text': '<p>Thanks <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=cheersyang"
            class="user-hover" rel="cheersyang">cheersyang</a> for your suggestion.</p>


            <p>Yes, RMServiceContext contains services which will be running always
            irrespective of the HA state of the RM. It''s better to move ResourceProfilesManager
            into RMServiceContext.</p>


            <p>Attached v2 patch for review.</p>'
          '@author': tao yang
          '@created': Thu, 29 Mar 2018 05:37:15 +0000
          '@id': '16418461'
        - '#text': '<p>thanks <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=Tao+Yang"
            class="user-hover" rel="Tao Yang">Tao Yang</a> for the patch! It is a
            blocker for 3.1.0.</p>


            <p>Regarding the patch, we have clear separation of alwaysOnService vs
            activeServiceContext. ResourceProfilesManager should be part of active
            service context because activeServiceContext context is refreshed  for
            every transition. I see that profiles are loaded during service initialization.
            If it get added into serviceContext, then profiles are NOT refreshed which
            get stale profile information. cc :/ <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=sunilg"
            class="user-hover" rel="sunilg">sunilg</a></p>'
          '@author': rohithsharma
          '@created': Thu, 29 Mar 2018 06:27:48 +0000
          '@id': '16418494'
        - '#text': "<p>This should be part of\_activeServiceContext. Same reason given\
            \ by <a href=\"https://issues.apache.org/jira/secure/ViewProfile.jspa?name=rohithsharma\"\
            \ class=\"user-hover\" rel=\"rohithsharma\">rohithsharma</a>, there is\
            \ more chance to have stale data if its alwaysOn</p>"
          '@author': sunilg
          '@created': Thu, 29 Mar 2018 06:31:19 +0000
          '@id': '16418496'
        - '#text': <p>Thanks <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=Tao+Yang"
            class="user-hover" rel="Tao Yang">Tao Yang</a> for reporting this issue,
            I'm glad to see this you found this issue before 3.1.0 release. <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=Tao+Yang"
            class="user-hover" rel="Tao Yang">Tao Yang</a>, could you report this
            to 3.1.0 voting thread and I will get a RC1 out tomorrow.</p>
          '@author': leftnoteasy
          '@created': Thu, 29 Mar 2018 06:54:10 +0000
          '@id': '16418514'
        - '#text': "<p>Thanks <a href=\"https://issues.apache.org/jira/secure/ViewProfile.jspa?name=rohithsharma\"\
            \ class=\"user-hover\" rel=\"rohithsharma\">rohithsharma</a>, <a href=\"\
            https://issues.apache.org/jira/secure/ViewProfile.jspa?name=sunilg\" class=\"\
            user-hover\" rel=\"sunilg\">sunilg</a> for your mentions.\_</p>\n\n<p>I\_\
            will correct it with\_moving\_ResourceProfilesManager to ActiveServiceContext\
            \ in v3 patch.</p>"
          '@author': tao yang
          '@created': Thu, 29 Mar 2018 06:58:14 +0000
          '@id': '16418519'
        - '#text': "<p>For 003.patch, profile adding at ResourceManager@serviceInit\
            \ need to be removed.\_ Otherwise ResourceProfilesManager created and\
            \ added into composite service 2 times unnecessarily i.e one at RM level\
            \ and active service init.</p>"
          '@author': rohithsharma
          '@created': Thu, 29 Mar 2018 07:19:05 +0000
          '@id': '16418536'
