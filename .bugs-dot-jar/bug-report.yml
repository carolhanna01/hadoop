      comments:
        comment:
        - '#text': "<p>The code in configuration looks like this:</p>\n\n<div class=\"\
            code panel\" style=\"border-width: 1px;\"><div class=\"codeContent panelContent\"\
            >\n<pre class=\"code-java\">        <span class=\"code-comment\">// Ignore\
            \ <span class=\"code-keyword\">this</span> parameter <span class=\"code-keyword\"\
            >if</span> it has already been marked as <span class=\"code-quote\">'<span\
            \ class=\"code-keyword\">final</span>'</span>\n</span>        <span class=\"\
            code-keyword\">if</span> (attr != <span class=\"code-keyword\">null</span>\
            \ &amp;&amp; value != <span class=\"code-keyword\">null</span>) {\n  \
            \        <span class=\"code-keyword\">if</span> (!finalParameters.contains(attr))\
            \ {\n            properties.setProperty(attr, value);\n            <span\
            \ class=\"code-keyword\">if</span> (storeResource) {\n              updatingResource.put(attr,\
            \ name.toString());\n            }\n            <span class=\"code-keyword\"\
            >if</span> (finalParameter)\n              finalParameters.add(attr);\n\
            \          } <span class=\"code-keyword\">else</span> {\n            LOG.warn(name+<span\
            \ class=\"code-quote\">\":a attempt to override <span class=\"code-keyword\"\
            >final</span> parameter: \"</span>+attr\n                     +<span class=\"\
            code-quote\">\";  Ignoring.\"</span>);\n          }\n        }\n</pre>\n\
            </div></div>\n\n<p>While the check for value being null is required before\
            \ adding the property to the 'properties' instance, adding it to finalParameters\
            \ or for that matter even updatingResource shouldn't be an issue even\
            \ if the value is null. This would certainly fix the current issue. Thoughts\
            \ ?</p>"
          '@author': yhemanth
          '@created': Tue, 1 Sep 2009 11:38:04 +0000
          '@id': '12749866'
        - '#text': <p>Patch with the fix</p>
          '@author': amareshwari
          '@created': Tue, 1 Sep 2009 12:37:45 +0000
          '@id': '12749887'
