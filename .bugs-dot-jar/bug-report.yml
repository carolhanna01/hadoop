          '@created': Thu, 19 Jun 2014 00:09:17 +0000
          '@id': '14036702'
        - '#text': "<p>Attached patch addresses the issue in two different ways:</p>\n\
            \n<ol>\n\t<li>Don't set the blocks to <tt>null</tt> when cleaning up those\
            \ blocks, but instead set them to <tt>BlockInfo.EMPTY_ARRAY</tt> as is\
            \ done elsewhere in the code.</li>\n\t<li>Make the FSImage saving code\
            \ be tolerant of <tt>null</tt> blocks on INodeFiles.</li>\n</ol>\n\n\n\
            <p>Either one of these by itself would be sufficient to address this issue,\
            \ but I figure it's a good idea to do both so as to better future-proof\
            \ this code against possible accidental goofs.</p>\n\n<p>Please review.</p>"
          '@author': atm
          '@created': Thu, 19 Jun 2014 00:15:12 +0000
          '@id': '14036708'
