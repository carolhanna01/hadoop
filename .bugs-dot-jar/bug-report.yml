      description: "<div class=\"code panel\" style=\"border-width: 1px;\"><div class=\"\
        codeContent panelContent\">\n<pre class=\"code-java\">    <span class=\"code-keyword\"\
        >case</span> DatanodeProtocol.DNA_TRANSFER:\n      <span class=\"code-comment\"\
        >// Send a copy of a block to another datanode\n</span>      dn.transferBlocks(bcmd.getBlockPoolId(),\
        \ bcmd.getBlocks(),\n          bcmd.getTargets(), bcmd.getTargetStorageTypes());\n\
        \      dn.metrics.incrBlocksReplicated(bcmd.getBlocks().length);</pre>\n</div></div>\n\
        <p>In the above code to handle replication transfers from namenode, <tt>DatanodeMetrics#blocksReplicated</tt>\
        \ is getting incremented early, since the transfer will happen in background.\
        \ <br/>\nAnd even failed transfers also getting counted.</p>\n\n<p>Correct\
        \ place to increment this counter is <tt>DataTransfer#run()</tt>.</p>"
