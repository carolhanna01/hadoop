      description: <p>Say you have a small cluster with 8gb memory and 5 queues.  This
        means that equal queue can have 8gb / 5 = 1.6gb but an AM requires 2gb to
        start so no AMs can be started.  By default, max-am-share check should be
        disabled so users don't see a regression. On medium-sized clusters, it still
        makes sense to set the max-am-share to a value between 0 and 1. </p>
