      comments:
        comment:
        - '#text': '<p>This patch will use InetAddress.getByName(String) to judge
            if a string is a numeric IP address or symbolic address(hostname). However,
            this JAVA api will also take trouble that it will translate some numeric
            hostname like: 1.2.3 to 1.2.0.3 (or 1.2 to 1.0.0.2) as it assume this
            patent of numeric string is IP address. It will break some current hadoop
            tests with "1.2.3" as hostname (like in TestTableMapping). Thoughts?</p>'
          '@author': djp
          '@created': Wed, 9 May 2012 12:19:04 +0000
          '@id': '13271356'
        - '#text': "<p>-1 overall.  Here are the results of testing the latest attachment\
            \ <br/>\n  <a href=\"http://issues.apache.org/jira/secure/attachment/12526152/HADOOP-8372.patch\"\
            \ class=\"external-link\" rel=\"nofollow\">http://issues.apache.org/jira/secure/attachment/12526152/HADOOP-8372.patch</a><br/>\n\
            \  against trunk revision .</p>\n\n<p>    +1 @author.  The patch does\
            \ not contain any @author tags.</p>\n\n<p>    +1 tests included.  The\
            \ patch appears to include 1 new or modified test files.</p>\n\n<p>  \
            \  +1 javadoc.  The javadoc tool did not generate any warning messages.</p>\n\
            \n<p>    +1 javac.  The applied patch does not increase the total number\
            \ of javac compiler warnings.</p>\n\n<p>    +1 eclipse:eclipse.  The patch\
            \ built with eclipse:eclipse.</p>\n\n<p>    +1 findbugs.  The patch does\
            \ not introduce any new Findbugs (version 1.3.9) warnings.</p>\n\n<p>\
            \    +1 release audit.  The applied patch does not increase the total\
            \ number of release audit warnings.</p>\n\n<p>    -1 core tests.  The\
            \ patch failed these unit tests in hadoop-common-project/hadoop-common:</p>\n\
            \n<p>                  org.apache.hadoop.fs.viewfs.TestViewFsTrash<br/>\n\
            \                  org.apache.hadoop.net.TestTableMapping</p>\n\n<p> \
            \   +1 contrib tests.  The patch passed contrib unit tests.</p>\n\n<p>Test\
            \ results: <a href=\"https://builds.apache.org/job/PreCommit-HADOOP-Build/964//testReport/\"\
            \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\"\
            >https://builds.apache.org/job/PreCommit-HADOOP-Build/964//testReport/</a><br/>\n\
            Console output: <a href=\"https://builds.apache.org/job/PreCommit-HADOOP-Build/964//console\"\
            \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\"\
            >https://builds.apache.org/job/PreCommit-HADOOP-Build/964//console</a></p>\n\
            \n<p>This message is automatically generated.</p>"
          '@author': hadoopqa
          '@created': Wed, 9 May 2012 14:22:07 +0000
          '@id': '13271442'
        - '#text': <p>Like said above, this change will break some current hadoop
            tests with "1.2.3" as hostname (like in TestTableMapping), as  InetAddress.getByName(String)
            will translate 1.2.3 to 1.2.0.3. May be checking full numeric host name
            (with dot) is a better way?</p>
          '@author': djp
          '@created': Wed, 9 May 2012 14:38:57 +0000
          '@id': '13271456'
        - '#text': '<div class="preformatted panel" style="border-width: 1px;"><div
            class="preformattedContent panelContent">

            <pre>A host name (label) MUST NOT consist of all numeric values.

            </pre>

            </div></div>


            <p>They are invalid host names, so the tests need to be fixed. I suggest
            you keep the patch as is and fix the broken tests.</p>


            <p>If a user puts an invalid host name in config, it will fail eventually.
            If this method were to return the string as is in such cases, it would
            get "translated" the same way somewhere down the road. We could add a
            full validation and make it blow up in this method, but I don''t think
            the gain is worth the complexity of the check.</p>'
          '@author': kihwal
          '@created': Wed, 9 May 2012 15:27:18 +0000
          '@id': '13271482'
        - '#text': '<p>I was concerned about performance implication of this change.
            However, in sun jdk, IPAddressUtil#isIPv4LiteralAddress() is called, which
            is doing more complete check for ip address before doing a look up.</p>


            <p>Please fix the tests. While at it, please indent the the code in the
            test correctly. Also, optionaly, you reduce a line by {{ return InetAddress.getByName(name).getHostAddress();
            }}</p>'
          '@author': sureshms
          '@created': Wed, 9 May 2012 16:21:18 +0000
          '@id': '13271540'
        - '#text': <p>BTW can you describe the test better, especially cases "3w.org
            -&gt; xx.xx.xx.xx" and "UnknownHost -&gt; UnknownHost" better.</p>
          '@author': sureshms
          '@created': Wed, 9 May 2012 16:36:07 +0000
          '@id': '13271561'
        - '#text': <p>Thanks all for the good comments. Will fix the tests and description
            soon.</p>
          '@author': djp
          '@created': Wed, 9 May 2012 16:45:32 +0000
          '@id': '13271571'
        - '#text': <p>Hey Suresh, For "3w.org -&gt; xx.xx.xx.xx", it is a public website
            start with numeric that can be resolved by DNS. So this test require DNS
            resolving, do you think this is an issue for hadoop unit test?</p>
          '@author': djp
          '@created': Wed, 9 May 2012 16:53:45 +0000
          '@id': '13271585'
        - '#text': '<blockquote><p>"3w.org -&gt; xx.xx.xx.xx", it is a public website
            start with numeric that can be resolved by DNS.</p></blockquote>

            <p>This could become an issue. But we could fix it later.</p>


            <p>Sorry I was not clear. What I meant in my previous comment was, you
            could add comments to make the test easier to understand. For example,
            you could method level comment to say {{ /** Test for {@link NetUtils#normalizeHostNames
            }}. Also you could add a comment saying, when ipaddress is normalized,
            same address is expected in return and for a resolvable hostname, ipaddress
            it resolved is expected in return.</p>


            <p>The reason why I am suggesting this is - our tests are poorly documented.
            When adding new features, lot more time goes into understanding tests
            and fixing them than implementing the feature itself.</p>'
          '@author': sureshms
          '@created': Wed, 9 May 2012 16:58:37 +0000
          '@id': '13271592'
        - '#text': '<blockquote><p>This could become an issue. But we could fix it
            later.</p></blockquote>

            <p>By this, I mean, if resolving the address using DNS fails for some
            reason, we could fix the test. So the code that you have added seems fine
            to me.</p>'
          '@author': sureshms
          '@created': Wed, 9 May 2012 17:00:08 +0000
          '@id': '13271594'
        - '#text': <p>Hi Suresh, That's very nicely suggestions. Will update patch
            soon.</p>
          '@author': djp
          '@created': Wed, 9 May 2012 17:08:15 +0000
          '@id': '13271604'
        - '#text': <p>Patch is updated with addressing TestTableMapping issue. The
            failure of TestViewFsTrash seems not relevant.</p>
