            \ class=\"external-link\" rel=\"nofollow\">http://issues.apache.org/jira/secure/attachment/12545462/YARN-108.patch</a><br/>\n\
            \  against trunk revision .</p>\n\n<p>    +1 @author.  The patch does\
            \ not contain any @author tags.</p>\n\n<p>    +1 tests included.  The\
            \ patch appears to include 1 new or modified test files.</p>\n\n<p>  \
            \  +1 javac.  The applied patch does not increase the total number of\
            \ javac compiler warnings.</p>\n\n<p>    +1 javadoc.  The javadoc tool\
            \ did not generate any warning messages.</p>\n\n<p>    +1 eclipse:eclipse.\
            \  The patch built with eclipse:eclipse.</p>\n\n<p>    +1 findbugs.  The\
            \ patch does not introduce any new Findbugs (version 1.3.9) warnings.</p>\n\
