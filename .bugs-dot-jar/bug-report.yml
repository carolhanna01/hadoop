        - '#text': "<p>The FsShell rm usage states:</p>\n<div class=\"preformatted\
            \ panel\" style=\"border-width: 1px;\"><div class=\"preformattedContent\
            \ panelContent\">\n<pre>-f     If the file does not exist, do not display\
            \ a diagnostic\n       message or modify the exit status to reflect an\
            \ error.\n</pre>\n</div></div>\n\n<p>How do you think the text should\
            \ be updated?</p>"
          '@author': daryn
          '@created': Wed, 6 Feb 2013 20:10:45 +0000
          '@id': '13572769'
