      description: '<p>There is no reason to ignore the configured capacity if the
        memory is 0 in the configuration.</p>


        <p>It makes it impossible to configure a zero absolute resource capacity.</p>


        <p>Example:</p>

        <div class="preformatted panel" style="border-width: 1px;"><div class="preformattedContent
        panelContent">

        <pre>root.default.capacity=[memory=0, vcores=0]

        root.default.maximum-capacity=[memory=2048, vcores=2]

        </pre>

        </div></div>'
