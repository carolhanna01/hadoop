          '@name': YARN-7341.001.patch
          '@size': '5405'
      comments:
        comment:
        - '#text': '<p>It turns out that this is a real bug introduced by <a href="https://issues.apache.org/jira/browse/YARN-7095"
            title="Federation: routing getNode/getNodes/getMetrics REST invocations
            transparently to multiple RMs" class="issue-link" data-issue-key="YARN-7095"><del>YARN-7095</del></a>.  <tt>RouterWebServiceUtil#mergeMetrics</tt>
            takes into two sets of metrics and merges them into the first one.  However,
            for a number of the metrics, it actually simply doubles the first metric.  For
            example</p>

            <div class="code panel" style="border-width: 1px;"><div class="codeContent
            panelContent">

            <pre class="code-java">

            metrics.setTotalNodes(metrics.getTotalNodes() + metrics.getTotalNodes());

            </pre>

            </div></div>

            <p>should be</p>

            <div class="code panel" style="border-width: 1px;"><div class="codeContent
            panelContent">

            <pre class="code-java">

            metrics.setTotalNodes(metrics.getTotalNodes() + metricsResponse.getTotalNodes());

            </pre>

            </div></div>


            <p>This should have failed every time, but the test also had a "flaw",
            which only made it flakey.  The test initializes two sets of metrics to
            random values using different <tt>Random</tt> objects using <tt>System.getCurrentTimeMillis()</tt>
            for the seed.  However, the code is fast enough that it often takes less
            than 1ms, causing the two objects to use the same seed.  When this happens,
            the two sets of metrics have the same values, and will mask the bug I
            described earlier.  If the code is slower (e.g. GC pause, swapping, adding
            a log statement for the seed, etc), then you''ll get different seed values
            and the test will (correctly) fail.</p>


            <p>The 001 patch fixes the bug by using the correct metric in <tt>RouterWebServiceUtil#mergeMetrics</tt>.  And
            it fixes the test by ensuring that the two seeds will be different.  It
            also cleans up some formatting and logs the seed for better debugability.</p>'
          '@author': rkanter
          '@created': Mon, 16 Oct 2017 23:46:16 +0000
          '@id': '16206790'
