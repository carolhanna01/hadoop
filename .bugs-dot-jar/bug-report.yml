      comments:
        comment:
        - '#text': <p>Patch to have FSDownload explicitly set the permissions of directories
            after creating them if the umask is too restrictive to set the requested
            permissions on create.</p>
          '@author': jlowe
          '@created': Mon, 17 Sep 2012 19:56:37 +0000
          '@id': '13457264'
        - '#text': "<p>+1 overall.  Here are the results of testing the latest attachment\
