      description: "<p>Checkpoints will start to fail and the NameNode will not be\
        \ able to manually saveNamespace if the following set of steps occurs:</p>\n\
        \n<ol>\n\t<li>A zero-length file appears in a snapshot</li>\n\t<li>That file\
        \ is later lengthened to include at least one block</li>\n\t<li>That file\
        \ is subsequently deleted from the present file system but remains in the\
        \ snapshot</li>\n</ol>\n\n\n<p>More details in the first comment.</p>"
