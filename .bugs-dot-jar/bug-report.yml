      description: '<p>When the cluster is configured with a restrictive umask, e.g.:
        <tt>fs.permissions.umask-mode=0077</tt>, the nodemanager can end up creating
        directory entries in the public cache with the wrong permissions.  The permissions
        can end up where only the nodemanager user can access files in the public
        cache, preventing jobs from running properly.</p>'
