        - '#text': "<p>Daryn, the docs need to be updated to indicate this behavior.\
            \ For example man page on rm says:</p>\n<div class=\"preformatted panel\"\
            \ style=\"border-width: 1px;\"><div class=\"preformattedContent panelContent\"\
            >\n<pre>     -f          Attempt to remove the files without prompting\
            \ for confirmation, regardless of the file's permissions.  If the file\
            \ does not exist, do not display a diagnostic message or modify the exit\n\
            \                 status to reflect an error.  The -f option overrides\
            \ any previous -i options.\n</pre>\n</div></div>\n\n<p>But this change\
            \ can be done in a later patch.</p>\n\n<p>+1 for the patch.</p>"
          '@author': sureshms
          '@created': Wed, 6 Feb 2013 18:19:15 +0000
          '@id': '13572634'
