    description: This file is an XML representation of an issue
    item:
      assignee:
        '#text': Jian He
        '@username': jianhe
      attachments:
        attachment:
          '@author': jianhe
          '@created': Sun, 9 Nov 2014 21:11:57 +0000
          '@id': '12680505'
          '@name': YARN-2834.1.patch
          '@size': '12733'
      comments:
        comment:
        - '#text': <p>The reason RM fails with NPE is that now if app fails to renew
            the token, it'll move to FAILED state and save the app final state. But
            we didn't fail the RMAppAttempt and save the attempt final state. So,
            on recovery, app won't be added to scheduler because app is already in
            final state, but it'll still try to add the attempt to scheduler which
            causes the NPE.</p>
          '@author': jianhe
          '@created': Sun, 9 Nov 2014 20:30:49 +0000
          '@id': '14204101'
        - '#text': <p>Talked with Zhijie, it should be fine to just ignore the token-renew
            exception on recovery and let app continue. App itself could decide whether
            it choose to fail or not when the token eventually expires.  Even in the
            regular case, RM doesn't fail the app if token renew fails, why do we
            need to fail the app if token-renew fails on recovery. </p>
          '@author': jianhe
          '@created': Sun, 9 Nov 2014 20:42:00 +0000
          '@id': '14204104'
        - '#text': '<blockquote><p>The reason RM fails with NPE is that now if app
            fails to renew the token, it''ll move to FAILED state and save the app
            final state. But we didn''t fail the RMAppAttempt and save the attempt
            final state.</p></blockquote>

            <p>Shouldn''t we move app-attempts to FAILED state whose parent app itself
            has failed? That is consistent with what happens in the regular control
            path.</p>


            <blockquote><p>Even in the regular case, RM doesn''t fail the app if token
            renew fails, why do we need to fail the app if token-renew fails on recovery.
            </p></blockquote>

            <p>Agreed this is an existing problem, but we should fix that too separately.
            <a href="https://issues.apache.org/jira/browse/YARN-342" title="RM doesn&#39;t
            retry token renewals" class="issue-link" data-issue-key="YARN-342"><del>YARN-342</del></a>
            is related.</p>'
          '@author': vinodkv
          '@created': Sun, 9 Nov 2014 21:21:20 +0000
          '@id': '14204119'
        - '#text': '<blockquote><p>Even in the regular case, RM doesn''t fail the
            app if token renew fails, why do we need to fail the app if token-renew
            fails on recovery. </p></blockquote>

            <p>After more discussions with <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=jianhe"
            class="user-hover" rel="jianhe">jianhe</a> offline, for things like Timeline
            tokens which are automatically obtained whether the app needs it or not
            (we should fix this to be user driven), we can ignore failures. But for
            HDFS Tokens etc, ignoring failures is bad because it (1) wastes resources
            as AMs will continue and eventually fail (2) app doesn''t know what happened
            it fails eventually.</p>


            <p>Anyways, treating renewal failures is broken today. I am okay ignoring
            renewal failures during recovery in this ticket. But let''s file a blocker
            for handling them correctly in 2.7.</p>'
          '@author': vinodkv
          '@created': Sun, 9 Nov 2014 21:35:34 +0000
          '@id': '14204128'
        - '#text': '<blockquote><p>Anyways, treating renewal failures is broken today.
            I am okay ignoring renewal failures during recovery in this ticket. But
            let''s file a blocker for handling them correctly in 2.7.</p></blockquote>


            <p>Thanks for your comments. +1 for this proposal.</p>'
          '@author': zjshen
          '@created': Sun, 9 Nov 2014 21:44:32 +0000
          '@id': '14204132'
