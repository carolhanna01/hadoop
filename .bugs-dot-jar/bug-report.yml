          '@id': '16563919'
        - '#text': <p>Thanks for the patch <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=bibinchundatt"
            class="user-hover" rel="bibinchundatt">bibinchundatt</a>. createApplicationMasterService
            is already registering an EventDispatcher for OpportunisticContainerAllocatorAMService
            when opportunistic scheduling is enabled in RMActiveServices composite
            service. Can you pls explain what is the issue and what this patch intends
            to fix? </p>
          '@author': suma.shivaprasad
          '@created': Tue, 31 Jul 2018 17:40:58 +0000
          '@id': '16564054'
        - '#text': <p><a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=bibinchundatt"
            class="user-hover" rel="bibinchundatt">bibinchundatt</a>, is this a regression
            recently? If yes, which JIRA breaks the use case?</p>
          '@author': leftnoteasy
          '@created': Tue, 31 Jul 2018 18:12:33 +0000
          '@id': '16564089'
        - '#text': '<p><a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=suma.shivaprasad"
            class="user-hover" rel="suma.shivaprasad">suma.shivaprasad</a></p>


            <blockquote>

            <p> EventDispatcher for OpportunisticContainerAllocatorAMService when
            opportunistic scheduling is enabled in RMActiveServices composite service</p></blockquote>

            <p>Coud you recheck, Its getting added to ResourceManager composite Service.
            <tt>createApplicationMasterService()</tt> of ResourceManager class not
            the inner RMActiveServices so service gets added to Resourcemanager CompositeService.</p>


            <p><a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=leftnoteasy"
            class="user-hover" rel="leftnoteasy">leftnoteasy</a></p>


            <p>Not regression but blocking issue as per functionality</p>'
          '@author': bibinchundatt
          '@created': Wed, 1 Aug 2018 04:57:33 +0000
          '@id': '16564737'
