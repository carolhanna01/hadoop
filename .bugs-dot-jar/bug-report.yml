        - '#text': <p>Yahoo! distribution patch. The patch for branch 0.20 will not
            apply to this distribution with <a href="https://issues.apache.org/jira/browse/HADOOP-6184"
            title="Provide a configuration dump in json format." class="issue-link"
            data-issue-key="HADOOP-6184"><del>HADOOP-6184</del></a> already in.</p>
          '@author': vinodkv
          '@created': Tue, 1 Sep 2009 13:05:45 +0000
          '@id': '12749900'
        - '#text': <p>Code changes look fine to me. +1.</p>
          '@author': yhemanth
          '@created': Tue, 1 Sep 2009 13:30:22 +0000
          '@id': '12749907'
        - '#text': <p>I just tested this fix on a single node cluster so as to enable/disable
            mapred debug script by setting it to null. The patch works as expected.
            A null value marked as final on server side can no longer be overridden
            by clients.</p>
          '@author': vinodkv
          '@created': Tue, 1 Sep 2009 13:59:00 +0000
          '@id': '12749914'
