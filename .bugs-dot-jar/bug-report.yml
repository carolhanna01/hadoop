      comments:
        comment:
        - '#text': '<p>This changes the filtering to consider both record name and
            tags.  I''ve also added unit tests to cover these cases.</p>


            <p>I''ve attached patches for trunk and branch-1.  Please commit the branch-1
            patch to branch-1-win also.</p>


            <p>Credit for this patch should go to both me and Ganeshan Iyer.  Thanks!</p>'
          '@author': cnauroth
          '@created': Wed, 10 Apr 2013 05:06:42 +0000
          '@id': '13627478'
        - '#text': "<p><font color=\"green\">+1 overall</font>.  Here are the results\
            \ of testing the latest attachment <br/>\n  <a href=\"http://issues.apache.org/jira/secure/attachment/12577955/HADOOP-9467.1.patch\"\
            \ class=\"external-link\" rel=\"nofollow\">http://issues.apache.org/jira/secure/attachment/12577955/HADOOP-9467.1.patch</a><br/>\n\
            \  against trunk revision .</p>\n\n<p>    <font color=\"green\">+1 @author</font>.\
            \  The patch does not contain any @author tags.</p>\n\n<p>    <font color=\"\
            green\">+1 tests included</font>.  The patch appears to include 1 new\
            \ or modified test files.</p>\n\n<p>    <font color=\"green\">+1 javac</font>.\
            \  The applied patch does not increase the total number of javac compiler\
            \ warnings.</p>\n\n<p>    <font color=\"green\">+1 javadoc</font>.  The\
            \ javadoc tool did not generate any warning messages.</p>\n\n<p>    <font\
            \ color=\"green\">+1 eclipse:eclipse</font>.  The patch built with eclipse:eclipse.</p>\n\
            \n<p>    <font color=\"green\">+1 findbugs</font>.  The patch does not\
            \ introduce any new Findbugs (version 1.3.9) warnings.</p>\n\n<p>    <font\
            \ color=\"green\">+1 release audit</font>.  The applied patch does not\
            \ increase the total number of release audit warnings.</p>\n\n<p>    <font\
            \ color=\"green\">+1 core tests</font>.  The patch passed unit tests in\
            \ hadoop-common-project/hadoop-common.</p>\n\n<p>    <font color=\"green\"\
            >+1 contrib tests</font>.  The patch passed contrib unit tests.</p>\n\n\
            <p>Test results: <a href=\"https://builds.apache.org/job/PreCommit-HADOOP-Build/2433//testReport/\"\
            \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\"\
            >https://builds.apache.org/job/PreCommit-HADOOP-Build/2433//testReport/</a><br/>\n\
            Console output: <a href=\"https://builds.apache.org/job/PreCommit-HADOOP-Build/2433//console\"\
            \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\"\
            >https://builds.apache.org/job/PreCommit-HADOOP-Build/2433//console</a></p>\n\
            \n<p>This message is automatically generated.</p>"
          '@author': hadoopqa
          '@created': Wed, 10 Apr 2013 05:48:37 +0000
          '@id': '13627513'
        - '#text': <p>The patches lgtm. +1. Thanks Chris and Ganeshan! Will commit
            shortly.</p>
